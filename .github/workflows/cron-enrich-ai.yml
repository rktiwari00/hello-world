name: College AI Enrichment Cron

on:
  schedule:
    # Run once daily at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  run-enrich-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: 'rktiwari00/sarakari-space-next-js-version'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run College AI Enrichment Script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          COLLEGE_MONGO_URI: ${{ secrets.COLLEGE_MONGO_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          FAILOVER_API_KEYS: ${{ secrets.FAILOVER_API_KEYS }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
          NEXTAUTH_URL: "https://www.sarkari.space"
        run: npx tsx scripts/run-enrich-colleges.ts
