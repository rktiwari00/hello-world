name: College Enrichment Cron

on:
  schedule:
    # Run every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-enrich-colleges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          repository: 'rktiwari00/sarakari-space-next-js-version'
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Download Google Sheet CSV
        run: curl -L -o colleges_enriched.csv "https://docs.google.com/spreadsheets/d/1U6u3-6DC63Uj-xAjNBYlpgaasBxOVJ6q099nqpzGYgI/export?format=csv"
        
      - name: Run College Import Script
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          COLLEGE_MONGO_URI: ${{ secrets.COLLEGE_MONGO_URI }}
        run: npx tsx scripts/import-colleges.ts
