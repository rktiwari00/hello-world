name: Astro Static Site Rebuild Cron

on:
  schedule:
    # Trigger Astro static site rebuild fallback every 4 hours (UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  trigger-astro-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Astro Rebuild via Repository Dispatch
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PRIVATE_REPO_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/rktiwari00/sarkari-space-astro/dispatches \
            -d '{"event_type":"cron_dispatch","client_payload":{"reason":"scheduled_4h_cron"}}'
          echo "Dispatched cron_dispatch to rktiwari00/sarkari-space-astro successfully."
